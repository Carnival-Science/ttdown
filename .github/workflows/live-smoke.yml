# Read-only smoke test of the DEPLOYED site (tests/smoke-live.test.js): loads the page like a visitor, checks every asset loads
# and nothing throws, and analyses a short generated click track in the browser. It never deploys or changes anything.
# Manual only (Actions > Live smoke > Run workflow). A schedule can be added later if it is wanted.
name: Live smoke

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Site to check"
        required: true
        default: "https://trackteardown.netlify.app/"

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Live smoke test
        run: npm run smoke:live
        env:
          TT_LIVE_URL: ${{ inputs.url }}
