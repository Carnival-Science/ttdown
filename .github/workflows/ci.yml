# Runs the feature tests, the G0 synthetic regression benchmark (with its gates) and the G1 harness checks
# on every push to main and every PR. Records are uploaded as artifacts so every run is reproducible and auditable.
# Actions are pinned to full commit SHAs (the comment shows the version tag each SHA was resolved from).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python -m pip install numpy mir_eval

      - name: Generate synthetic test songs and their annotation files
        run: npm run songs

      - name: Generate time-model fixtures (used by the timing tests; also reported below)
        run: npm run songs:time

      - name: Feature tests
        run: npm test

      - name: G0 benchmark (fails below tests/benchmark-gates.json)
        run: npm run benchmark

      - name: G1 harness on the synthetic manifest
        run: npm run bench:synthetic

      - name: G1 parity with G0 (acceptance check)
        run: npm run bench:parity

      - name: G1 metrics cross-checked against mir_eval
        run: npm run bench:crosscheck

      - name: G1 ground-truth integrity and coverage enforcement (on the real predictions)
        run: npm run bench:integrity

      - name: "Time-model fixtures (reported, not gated; see docs/TIME_FIXTURES_BASELINE.md)"
        run: |
          npm run bench:time-fixtures
          node bench/time-fixtures-summary.js bench/out/time-fixtures > bench/out/time-fixtures/summary.md

      - name: Upload run records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-records
          path: |
            tests/out/*.json
            bench/out/synthetic/
            bench/out/time-fixtures/
          if-no-files-found: warn
          retention-days: 30
