# Runs the feature tests, the G0 synthetic regression benchmark (with its gates) and the G1 harness checks
# on every push to main and every PR. Records are uploaded as artifacts so every run is reproducible and auditable.
# Actions are pinned to full commit SHAs (the comment shows the version tag each SHA was resolved from).
#
# Stages: `fast` (type check, unit tests, fast smoke; a few minutes) runs first. The long jobs start only when it passes:
# `test` (feature tests, benchmarks, harness), `app` (smoke, parity, product tests, the Chromium end-to-end journey) and
# `e2e-browsers` (the same journey in Firefox and WebKit). `npm run ci:local` runs the same stages in order on a workstation.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: fails fast. No Python and no generated songs: the fast smoke test generates its own short click track.
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22 # Vite 8 and Vitest 5 need >= 22.12
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm ci --prefix app

      - name: Type check (svelte-check, tsc) and UI SDK import boundary
        run: npm run app:check

      - name: "Unit tests: app modules (Vitest)"
        run: npm run app:unit

      - name: "Unit tests: engine, TimeMap, timing store, MIDI, scorers (Node)"
        run: npm run test:unit

      - name: Production build
        run: npm --prefix app run build

      - name: Fast smoke test (production build, generated click track)
        run: npm run smoke:fast

  test:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          python -m pip install numpy mir_eval

      - name: Generate synthetic test songs and their annotation files
        run: npm run songs

      - name: Generate time-model fixtures (used by the timing tests; also reported below)
        run: npm run songs:time

      - name: Generate melody fixtures (melody and bass change between sections; one drifts in tempo)
        run: npm run songs:melody

      - name: Feature tests
        run: npm test

      - name: G0 benchmark (fails below tests/benchmark-gates.json)
        run: npm run benchmark

      - name: G1 harness on the synthetic manifest
        run: npm run bench:synthetic

      - name: G1 parity with G0 (acceptance check)
        run: npm run bench:parity

      - name: G1 metrics cross-checked against mir_eval
        run: npm run bench:crosscheck

      - name: G1 ground-truth integrity and coverage enforcement (on the real predictions)
        run: npm run bench:integrity

      - name: "Time-model fixtures (reported, not gated; see docs/TIME_FIXTURES_BASELINE.md)"
        run: |
          npm run bench:time-fixtures
          node bench/time-fixtures-summary.js bench/out/time-fixtures > bench/out/time-fixtures/summary.md
          python bench/crosscheck_mir_eval.py bench/out/time-fixtures/scores.json

      - name: Scorable regions scored end to end (on the real predictions)
        run: npm run bench:regions

      - name: "Arrangement fixtures: section boundaries vs the pinned Version A (and mir_eval)"
        run: |
          npm run bench:arrangement
          node tests/arrangement-vs-version-a.test.js
          python bench/crosscheck_mir_eval.py bench/out/arrangement-fixtures/scores.json

      - name: Melody scoring end to end, and the transcription/melody scorers against mir_eval
        run: |
          npm run bench:melody
          npm run bench:transcription

      - name: "Full-track transcription vs the repeated 4-bar pattern (melody fixtures checked; synthetic set reported)"
        run: npm run bench:melody-track

      - name: Upload run records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-records
          path: |
            tests/out/*.json
            bench/out/synthetic/
            bench/out/time-fixtures/
            bench/out/arrangement-fixtures/
          if-no-files-found: warn
          retention-days: 30

  # Svelte application (app/, migration M1): type check, UI SDK import boundary, both builds, build manifests, and the
  # browser smoke test against the Vite dev server and both compiled builds over localhost. Separate job, so the legacy
  # job above is unchanged. The app has its own lockfile (app/package-lock.json); Playwright comes from the root install.
  app:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22 # Vite 8 needs ^20.19 or >= 22.12
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm ci --prefix app
          python -m pip install numpy

      - name: Generate synthetic songs, time fixtures and arrangement fixtures (for the analyzer parity gate)
        run: |
          npm run songs
          npm run songs:time

      - name: Type check (svelte-check, tsc) and UI SDK import boundary
        run: npm run app:check

      - name: Production and bench builds, with external build manifests
        run: npm run app:build

      - name: Browser smoke test (dev server, production build, bench build)
        run: npm run app:smoke

      - name: "Analyzer parity: the Svelte app and the legacy page give identical predictions on every track"
        run: npm run app:parity

      - name: "Product tests: behaviour of the v1 app (stale jobs, cancel, limits, bars, sections, saved timing, exports, labels, timeline, volume, no removed features)"
        run: npm run app:product-tests

      - name: "Data compatibility: legacy page and Svelte app read each other's saved data on the same origin"
        run: node tests/app-storage-roundtrip.test.js

      - name: "Saved-data variants: records with missing optional fields open in the Svelte app wherever the legacy page opens them"
        run: node tests/app-saved-data-variants.test.js

      - name: "End-to-end journey in Chromium (production build): upload, analyse, export, save, reload, reopen"
        run: npm run e2e:journey

      - name: Upload build manifests and smoke screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-build
          path: |
            app/dist/*/build-manifest.json
            app/tests/out/
          if-no-files-found: warn
          retention-days: 30

  # The end-to-end journey in the other browser engines. Chromium runs it in the `app` job above.
  e2e-browsers:
    needs: fast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}
          npm ci --prefix app
          python -m pip install numpy

      - name: Generate synthetic test songs
        run: npm run songs

      - name: Production build
        run: npm --prefix app run build

      - name: "End-to-end journey in ${{ matrix.browser }} (production build)"
        run: npm run e2e:journey
        env:
          TT_BROWSER: ${{ matrix.browser }}

      - name: Upload the journey's downloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-journey-${{ matrix.browser }}
          path: tests/out/e2e-journey-${{ matrix.browser }}/
          if-no-files-found: warn
          retention-days: 14
